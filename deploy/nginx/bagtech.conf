# BagTech (bagtech.az, www.bagtech.az) — static site.
# Lives on the server as /etc/nginx/sites-available/bagtech.conf, enabled as
# sites-enabled/zz-bagtech.conf (the zz- prefix keeps mailcow.conf the default
# server for unknown hosts). Files: /var/www/bagtech.az (git clone of this repo).
# Only its own server_names; nothing here is shared with the other sites.

server {
    listen 80;
    listen [::]:80;
    server_name bagtech.az www.bagtech.az;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ { root /var/www/bagtech-acme; default_type text/plain; }
    location / { return 301 https://bagtech.az$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bagtech.az www.bagtech.az;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/bagtech.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bagtech.az/privkey.pem;

    root  /var/www/bagtech.az;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/rss+xml;

    location ^~ /.well-known/acme-challenge/ { root /var/www/bagtech-acme; default_type text/plain; }

    if ($host = www.bagtech.az) { return 301 https://bagtech.az$request_uri; }

    # repo internals are not part of the site
    location ~ /\.        { return 404; }
    location ^~ /deploy/  { return 404; }
    location ^~ /_build/  { return 404; }

    # pages that were renamed
    location = /xidmetler/saytlar-e-ticaret/ { return 301 /xidmetler/saytlarin-hazirlanmasi/; }
    location = /xidmetler/texniki-destek/    { return 301 /xidmetler/it-autsorsinq/; }

    location = /404.html { internal; }
    location = /llms.txt { default_type "text/plain; charset=utf-8"; }
    location ~* \.xml$   { add_header Cache-Control "public, max-age=3600"; }

    # versioned or rarely-changing static files
    location ~* \.(css|js|png|jpe?g|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ =404; }
}
