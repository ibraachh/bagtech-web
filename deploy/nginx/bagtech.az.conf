# BagTech — bagtech.az (static site)
# Additive config: lives in its own file, serves only /var/www/bagtech.az.
# HTTPS: run `certbot --nginx -d bagtech.az -d www.bagtech.az` after HTTP works —
# certbot edits this file only.

server {
    listen 80;
    listen [::]:80;
    server_name www.bagtech.az;
    return 301 http://bagtech.az$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name bagtech.az;

    root /var/www/bagtech.az;
    index index.html;

    # never expose the repo internals
    location ~ /\.(git|gitignore) { deny all; return 404; }
    location ^~ /deploy/          { deny all; return 404; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # assets are cache-busted with ?v= — cache hard
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
